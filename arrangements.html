<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invitation For Her Royal Highness</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Cinzel:wght@400;600&display=swap');

  :root{
    --plum: #1f0d24;
    --plum-deep: #140816;
    --burgundy: #4a1226;
    --wine: #8c2f45;
    --blush: #f4d8d8;
    --gold: #d9a441;
    --gold-bright: #f3cd6b;
    --gold-pale: #ffe9a8;
    --cream: #f7ecd9;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background: radial-gradient(circle at 50% 20%, var(--burgundy) 0%, var(--plum) 55%, var(--plum-deep) 100%);
    font-family:'Cinzel', serif;
    overflow:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  .stage{
    position:relative;
    height:100vh;
    width:100vw;
  }

  /* ---- breathing vignette ---- */
  #breathe{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    background: radial-gradient(circle at 50% 45%, rgba(243,205,107,0.10) 0%, rgba(243,205,107,0) 55%);
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{
    0%, 100%{ opacity:0.5; transform: scale(1); }
    50%{ opacity:1; transform: scale(1.08); }
  }

  /* ---- ambient gold dust ---- */
  #dustCanvas{
    position:absolute;
    inset:-30px;
    z-index:1;
    pointer-events:none;
    transition: transform 0.4s ease-out;
  }

  /* ---- ornamental vignette frame around the whole stage ---- */
  .royal-frame{
    position:absolute;
    inset:14px;
    border: 1px solid rgba(217,164,65,0.35);
    z-index:2;
    pointer-events:none;
  }
  .royal-frame::before, .royal-frame::after,
  .royal-frame .fc-tr, .royal-frame .fc-bl{
    content:"";
    position:absolute;
    width:34px;
    height:34px;
    border: 1.5px solid var(--gold);
    opacity:0.55;
  }
  .royal-frame::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .royal-frame::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .royal-frame .fc-tr{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .royal-frame .fc-bl{ bottom:-1px; left:-1px; border-right:none; border-top:none; }

  .page{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.15s ease;
    z-index:3;
  }

  .page.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ---- wax seal intro ---- */
  #seal-wrap{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--plum-deep);
  }

  #seal-wrap.crack .seal-half-top{
    animation: crackTop 0.6s ease-in forwards;
  }
  #seal-wrap.crack .seal-half-bottom{
    animation: crackBottom 0.6s ease-in forwards;
  }
  #seal-wrap.crack .seal-glow{
    animation: sealFlash 0.6s ease-in forwards;
  }
  #seal-wrap.hide{
    animation: sealFade 0.5s ease forwards 0.55s;
  }

  @keyframes crackTop{
    0%{ transform: translateY(0) rotate(0); opacity:1; }
    100%{ transform: translateY(-120vh) rotate(-8deg); opacity:0; }
  }
  @keyframes crackBottom{
    0%{ transform: translateY(0) rotate(0); opacity:1; }
    100%{ transform: translateY(120vh) rotate(8deg); opacity:0; }
  }
  @keyframes sealFlash{
    0%{ opacity:0; }
    40%{ opacity:1; }
    100%{ opacity:0; }
  }
  @keyframes sealFade{
    to{ opacity:0; visibility:hidden; }
  }

  .seal-emblem{
    position:relative;
    width:150px;
    height:150px;
  }
  .seal-emblem::before{
    content:"";
    position:absolute;
    inset:-26px;
    border-radius:50%;
    border: 1px dashed rgba(243,205,107,0.4);
    animation: haloSpin 14s linear infinite;
  }
  .seal-emblem::after{
    content:"";
    position:absolute;
    inset:-42px;
    border-radius:50%;
    border: 1px dashed rgba(243,205,107,0.22);
    animation: haloSpin 22s linear infinite reverse;
  }
  @keyframes haloSpin{
    to{ transform: rotate(360deg); }
  }
  .seal-half-top, .seal-half-bottom{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  .seal-half-top{ clip-path: inset(0 0 50% 0); }
  .seal-half-bottom{ clip-path: inset(50% 0 0 0); }

  .seal-glow{
    position:absolute;
    inset:-40px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(243,205,107,0.8) 0%, rgba(243,205,107,0) 70%);
    opacity:0;
  }

  .seal-caption{
    position:absolute;
    bottom:14%;
    left:0;
    right:0;
    text-align:center;
    font-family:'Cinzel', serif;
    letter-spacing:0.22em;
    font-size:0.72rem;
    color: rgba(247,236,217,0.55);
    animation: fadeIn 1s ease forwards 0.3s;
    opacity:0;
  }
  @keyframes fadeIn{ to{ opacity:1; } }

  /* ---- page 1: name reveal ---- */
  .crest-wrap{
    position:relative;
    margin-bottom:22px;
    opacity:0;
    transform: translateY(-8px) scale(0.9);
    animation: crestDrop 0.7s ease-out forwards 0.15s;
  }
  .crest-mini{
    display:block;
    animation: crestSpin 18s linear infinite;
  }
  @keyframes crestSpin{
    to{ transform: rotate(360deg); }
  }
  .crest-orbit{
    position:absolute;
    inset:-16px;
    pointer-events:none;
  }
  .crest-orbit span{
    position:absolute;
    top:50%;
    left:50%;
    width:4px;
    height:4px;
    border-radius:50%;
    background: var(--gold-bright);
    box-shadow: 0 0 6px 1px rgba(243,205,107,0.7);
    animation: orbit 6s linear infinite;
  }
  .crest-orbit span:nth-child(1){ animation-delay: 0s; }
  .crest-orbit span:nth-child(2){ animation-delay: -2s; }
  .crest-orbit span:nth-child(3){ animation-delay: -4s; }
  @keyframes orbit{
    from{ transform: rotate(0deg) translateX(38px) rotate(0deg); opacity:0.9; }
    50%{ opacity:0.3; }
    to{ transform: rotate(360deg) translateX(38px) rotate(-360deg); opacity:0.9; }
  }
  @keyframes crestDrop{
    to{ opacity:0.9; transform: translateY(0) scale(1); }
  }

  #page-name h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(2.2rem, 7vw, 3.6rem);
    color:var(--cream);
    margin:0;
    white-space:nowrap;
    text-shadow: 0 0 26px rgba(243,205,107,0.18);
  }

  #page-name .hey-letter{
    display:inline-block;
    opacity:0;
    transform: translateY(10px);
    animation: popIn 0.35s cubic-bezier(.2,1.6,.4,1) forwards;
  }

  #page-name .extra-y{
    display:inline-block;
    opacity:0;
    transform: translateY(6px);
  }

  #page-name .extra-y.show{
    animation: popIn 0.3s cubic-bezier(.2,1.6,.4,1) forwards;
  }

  @keyframes popIn{
    0%{ opacity:0; transform: translateY(6px) scale(0.7); text-shadow: 0 0 0 rgba(243,205,107,0); }
    55%{ opacity:1; transform: translateY(-3px) scale(1.08); text-shadow: 0 0 18px rgba(243,205,107,0.6); }
    100%{ opacity:1; transform: translateY(0) scale(1); text-shadow: 0 0 6px rgba(243,205,107,0.25); }
  }

  #page-name .name-line{
    position:relative;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(1.5rem, 4.5vw, 2.1rem);
    color:var(--gold-bright);
    margin-top:26px;
    padding-bottom:10px;
    opacity:0;
    transform: translateY(-140px);
    overflow:hidden;
  }
  #page-name .name-line::before{
    content:"";
    position:absolute;
    top:0;
    bottom:10px;
    left:-60%;
    width:35%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.65), transparent);
    mix-blend-mode: overlay;
    opacity:0;
  }
  #page-name .name-line.shimmer::before{
    animation: shimmerSweep 1.1s ease-out forwards;
  }
  @keyframes shimmerSweep{
    0%{ left:-60%; opacity:0; }
    15%{ opacity:1; }
    85%{ opacity:1; }
    100%{ left:120%; opacity:0; }
  }

  #page-name .name-line.show{
    animation: slideIn 0.7s cubic-bezier(.22,.9,.3,1.1) forwards;
  }
  #page-name .name-line.show::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:0;
    width:0;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transform: translateX(-50%);
    animation: underlineGrow 0.8s ease-out forwards 0.55s;
  }

  @keyframes slideIn{
    0%   { opacity:0; transform: translateY(-140px) rotate(-2deg); }
    70%  { opacity:1; transform: translateY(4px) rotate(0.3deg); }
    100% { opacity:1; transform: translateY(0) rotate(0); }
  }
  @keyframes underlineGrow{
    to{ width:70%; }
  }

  /* ---- curtain-drape transition ---- */
  .drape{
    position:absolute;
    inset:0;
    z-index:15;
    pointer-events:none;
    display:flex;
  }
  .drape-panel{
    flex:1;
    background: linear-gradient(180deg, var(--wine) 0%, var(--burgundy) 55%, var(--plum-deep) 100%);
    transform: scaleY(0);
    box-shadow: 0 0 40px rgba(0,0,0,0.4) inset;
  }
  .drape-panel.left{ transform-origin: top; border-right: 1px solid rgba(217,164,65,0.4); }
  .drape-panel.right{ transform-origin: bottom; border-left: 1px solid rgba(217,164,65,0.4); }

  .drape.run .drape-panel{
    animation: drapeSweep 1.05s cubic-bezier(.76,0,.2,1) forwards;
  }
  @keyframes drapeSweep{
    0%   { transform: scaleY(0); }
    45%  { transform: scaleY(1); }
    55%  { transform: scaleY(1); }
    100% { transform: scaleY(0); }
  }
  .drape-panel.left.run{ transform-origin: top; }
  .drape-panel.right.run{ transform-origin: bottom; }

  /* ---- page: yes ---- */
  #page-yes p{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(1.6rem, 5vw, 2.6rem);
    color:var(--blush);
    line-height:1.35;
    max-width:600px;
    opacity:0;
    transform: translateY(10px);
  }
  #page-yes.active p{
    animation: riseIn 0.8s ease-out forwards 0.15s;
  }
  @keyframes riseIn{
    to{ opacity:1; transform: translateY(0); }
  }

  #page-yes .name-fill{
    color:var(--gold-bright);
    font-style:normal;
    font-weight:600;
    text-shadow: 0 0 16px rgba(243,205,107,0.35);
  }

  #page-yes .sub{
    margin-top:20px;
    font-family:'Cinzel', serif;
    letter-spacing:0.12em;
    font-size:0.75rem;
    color: rgba(244,216,216,0.55);
    opacity:0;
  }
  #page-yes.active .sub{
    animation: fadeIn 1s ease forwards 0.9s;
  }

  /* ---- Q&A page ---- */
  .qa-eyebrow{
    font-family:'Cinzel', serif;
    letter-spacing:0.2em;
    font-size:0.68rem;
    color: rgba(217,164,65,0.7);
    margin-bottom:12px;
    min-height:1em;
  }
  .qa-eyebrow .type-cursor{
    display:inline-block;
    width:1px;
    margin-left:2px;
    color: var(--gold-bright);
    animation: cursorBlink 0.8s steps(1) infinite;
  }
  @keyframes cursorBlink{
    50%{ opacity:0; }
  }

  .qa-question{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(1.6rem, 5vw, 2.3rem);
    color:var(--cream);
    margin-bottom:34px;
    max-width:520px;
  }

  .qa-options{
    display:flex;
    flex-direction:row;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    width:100%;
    max-width:560px;
  }

  .option-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    width:150px;
    cursor:pointer;
    opacity:0;
    transform: translateY(14px);
    animation: cardRise 0.6s ease-out forwards;
    perspective: 500px;
  }
  .option-card .option-thumb{
    transform: rotateX(0deg) rotateY(0deg);
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.12s ease-out, box-shadow 0.25s ease;
    transform-style: preserve-3d;
  }
  .option-card:nth-child(1){ animation-delay: 0.05s; }
  .option-card:nth-child(2){ animation-delay: 0.16s; }
  .option-card:nth-child(3){ animation-delay: 0.27s; }
  @keyframes cardRise{
    to{ opacity:1; transform: translateY(0); }
  }

  .option-thumb{
    position:relative;
    width:100%;
    height:104px;
    border:1px solid rgba(217,164,65,0.45);
    border-radius:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.68rem;
    letter-spacing:0.05em;
    color: rgba(247,236,217,0.4);
    background: rgba(255,255,255,0.02);
    overflow:hidden;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
  }
  .option-thumb::before, .option-thumb::after{
    content:"";
    position:absolute;
    width:12px;
    height:12px;
    border: 1px solid rgba(217,164,65,0.55);
    opacity:0.7;
    transition: opacity 0.25s ease, border-color 0.25s ease;
    z-index:2;
  }
  .option-thumb::before{ top:4px; left:4px; border-right:none; border-bottom:none; }
  .option-thumb::after{ bottom:4px; right:4px; border-left:none; border-top:none; }

  .thumb-shimmer{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .thumb-shimmer::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:-40%;
    width:22%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.18), transparent);
    animation: thumbShimmerSweep 4.5s ease-in-out infinite;
  }
  .option-card:nth-child(2) .thumb-shimmer::before{ animation-delay: 1.5s; }
  .option-card:nth-child(3) .thumb-shimmer::before{ animation-delay: 3s; }
  @keyframes thumbShimmerSweep{
    0%{ left:-40%; }
    35%{ left:130%; }
    100%{ left:130%; }
  }

  .option-thumb img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }

  .option-badge{
    width:26px;
    height:26px;
    border-radius:50%;
    background: linear-gradient(160deg, var(--gold-bright), var(--gold));
    color: var(--plum-deep);
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:0.82rem;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }

  .option-label{
    width:100%;
    border:1px solid rgba(217,164,65,0.4);
    border-radius:2px;
    padding:7px 8px;
    font-family:'Cinzel', serif;
    font-size:0.7rem;
    letter-spacing:0.03em;
    color: var(--cream);
    text-align:center;
    line-height:1.3;
    transition: border-color 0.25s ease, background 0.25s ease;
  }

  .option-card:hover .option-thumb{
    border-color: var(--gold-bright);
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(217,164,65,0.2);
  }
  .option-card:hover .option-thumb::before,
  .option-card:hover .option-thumb::after{
    opacity:1;
    border-color: var(--gold-bright);
  }

  .option-card.selected .option-thumb{
    border-color: var(--gold-bright);
    background: rgba(217,164,65,0.14);
    box-shadow: 0 0 0 1px rgba(243,205,107,0.5), 0 8px 20px rgba(217,164,65,0.25);
  }
  .option-card.selected .option-label{
    border-color: var(--gold-bright);
    background: rgba(217,164,65,0.1);
  }
  .option-card.selected .option-badge{
    animation: badgePulse 0.5s ease;
  }
  @keyframes badgePulse{
    0%{ transform: scale(1); }
    45%{ transform: scale(1.25); box-shadow: 0 0 14px rgba(243,205,107,0.7); }
    100%{ transform: scale(1); }
  }

  .husband-btn{
    margin-top:32px;
    background:transparent;
    border:1px solid rgba(217,164,65,0.5);
    color: var(--gold-bright);
    font-family:'Cinzel', serif;
    letter-spacing:0.08em;
    font-size:0.78rem;
    padding:12px 28px;
    border-radius:999px;
    cursor:pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    animation: gentleGlow 3.2s ease-in-out infinite;
  }

  .husband-btn:hover{
    border-color: var(--gold-bright);
    background: rgba(217,164,65,0.08);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(217,164,65,0.18);
  }

  .continue-btn{
    margin-top:30px;
    position:relative;
    background: linear-gradient(160deg, var(--wine), var(--burgundy));
    color:var(--cream);
    border:1px solid rgba(217,164,65,0.5);
    padding:13px 36px;
    border-radius:999px;
    font-family:'Cinzel', serif;
    letter-spacing:0.08em;
    font-size:0.82rem;
    cursor:pointer;
    opacity:0;
    transform: translateY(8px);
    pointer-events:none;
    transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.25s ease;
  }

  .continue-btn.show{
    opacity:1;
    transform: translateY(0);
    pointer-events:auto;
    animation: gentleGlow 2.4s ease-in-out infinite;
  }

  .continue-btn:hover{
    box-shadow: 0 6px 22px rgba(217,164,65,0.35);
  }
  @keyframes gentleGlow{
    0%, 100%{ box-shadow: 0 0 0 rgba(217,164,65,0); }
    50%{ box-shadow: 0 0 16px rgba(217,164,65,0.35); }
  }

  /* ---- roulette page ---- */
  .roulette-caption{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:clamp(1.3rem, 4vw, 1.8rem);
    color: var(--gold-bright);
    margin-bottom:28px;
    min-height:2.4em;
  }

  .roulette-stage{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .roulette-frame{
    position:relative;
    width:224px;
    height:304px;
    border:1px solid rgba(217,164,65,0.5);
    border-radius:4px;
    overflow:hidden;
    background: rgba(255,255,255,0.02);
    transition: box-shadow 0.4s ease, border-color 0.4s ease;
  }
  .roulette-frame::before{
    content:"";
    position:absolute;
    inset:8px;
    border: 1px solid rgba(217,164,65,0.25);
    pointer-events:none;
    z-index:2;
  }

  .roulette-spotlight{
    position:absolute;
    inset:0;
    background: radial-gradient(circle at 50% 40%, rgba(243,205,107,0) 0%, rgba(243,205,107,0) 100%);
    z-index:1;
    pointer-events:none;
    transition: background 0.4s ease;
  }
  .roulette-frame.spinning .roulette-spotlight{
    background: radial-gradient(circle at 50% 40%, rgba(243,205,107,0.18) 0%, rgba(243,205,107,0) 70%);
  }

  .roulette-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
  }

  .roulette-img.active{
    opacity:1;
  }

  .roulette-frame.landed{
    border-color: var(--gold-bright);
    box-shadow: 0 0 0 5px rgba(217,164,65,0.15), 0 0 30px rgba(217,164,65,0.3);
  }
  .roulette-frame.landed .roulette-spotlight{
    background: radial-gradient(circle at 50% 40%, rgba(243,205,107,0.3) 0%, rgba(243,205,107,0) 75%);
  }

  .roulette-frame.holding{
    animation: holdPulse 0.55s ease-in-out infinite;
  }
  @keyframes holdPulse{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(243,205,107,0.15); }
    50%{ box-shadow: 0 0 0 6px rgba(243,205,107,0.1); }
  }

  .roulette-frame.punch{
    animation: zoomPunch 0.45s cubic-bezier(.25,1.6,.4,1);
  }
  @keyframes zoomPunch{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.07); }
    100%{ transform: scale(1); }
  }

  #screenFlash{
    position:absolute;
    inset:0;
    z-index:25;
    pointer-events:none;
    background: radial-gradient(circle at 50% 45%, rgba(255,240,210,0.9) 0%, rgba(255,240,210,0) 60%);
    opacity:0;
  }
  #screenFlash.fire{
    animation: screenFlashAnim 0.6s ease-out forwards;
  }
  @keyframes screenFlashAnim{
    0%{ opacity:0; }
    18%{ opacity:0.85; }
    100%{ opacity:0; }
  }

  .page.shake{
    animation: pageShake 0.4s ease-in-out;
  }
  @keyframes pageShake{
    0%, 100%{ transform: translate(0,0); }
    20%{ transform: translate(-3px, 2px); }
    40%{ transform: translate(3px, -2px); }
    60%{ transform: translate(-2px, -1px); }
    80%{ transform: translate(2px, 1px); }
  }

  .ray-burst{
    position:absolute;
    inset:-60px;
    z-index:0;

    opacity:0;
  }

  }
  @keyframes rayShow{
    0%{ opacity:0; transform: rotate(0deg) scale(0.7); }
    30%{ opacity:0.85; }
    100%{ opacity:0; transform: rotate(35deg) scale(1.2); }
  }

  .roulette-title{
    margin-top:22px;
    font-family:'Cinzel', serif;
    letter-spacing:0.1em;
    font-size:0.85rem;

    opacity:0;

  }

  .roulette-title.show{
    opacity:1;
  }

  /* ---- Thank-you page ---- */
  /* ---- confirm page ---- */
  #page-confirm{ position:relative; }
  #page-confirm .qa-eyebrow{ margin-bottom:20px; }
  #page-confirm p{
    position:relative;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;

  #page-confirm .movie-fill{

  #page-confirm .movie-fill .letter{
    display:inline-block;
    opacity:0;
    transform: translateY(10px) scale(0.85);
    animation: letterPop 0.4s cubic-bezier(.22,1.6,.4,1) forwards;
  }
  @keyframes letterPop{
    60%{ opacity:1; transform: translateY(-2px) scale(1.12); text-shadow: 0 0 16px rgba(243,205,107,0.6); }
    100%{ opacity:1; transform: translateY(0) scale(1); text-shadow: 0 0 6px rgba(243,205,107,0.25); }
  }
  #page-confirm .tail-text{
    display:inline-block;
    opacity:0;
    animation: fadeIn 0.5s ease forwards;

  #page-confirm .ray-burst{
    top:50%;
    left:50%;
    width:260px;

    inset:auto;
    transform: translate(-50%,-50%);
    margin:0;

  #page-thanks .crest-wrap{

  #page-thanks p{

    opacity:0;
    transform: translateY(10px);
  }
  #page-thanks.active p{
    animation: riseIn 0.9s ease-out forwards 0.25s;
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script>
  // change this to whatever her name is — it drives both pages
  const NAME = "Abena";
  const FORMSPREE_ENDPOINT = "https://formspree.io/f/myeyqbpd";

  // Silently reports her pick to Formspree without touching the UI/animation.
  // Fire-and-forget: we never block or alter the visual flow on success/failure.
  function reportChoice(choice, method){
    fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        name: NAME,
        choice: choice,
        method: method, // "picked" or "husband decided"
        timestamp: new Date().toISOString()
      })
    }).catch(() => {
      // Silently ignore network errors — this must never disrupt her experience.
    });
  }

  const pageName = document.getElementById('page-name');
  const pageYes = document.getElementById('page-yes');
  const pageQa = document.getElementById('page-qa');
  const pageThanks = document.getElementById('page-thanks');
  const nameLine = document.getElementById('nameLine');
  const nameEcho = document.getElementById('nameEcho');
  const drape = document.getElementById('drape');
  const sealWrap = document.getElementById('seal-wrap');

  const optionButtons = document.querySelectorAll('.option-card');
  const husbandBtn = document.getElementById('husbandBtn');
  const qaContinue = document.getElementById('qaContinue');

  const pageConfirm = document.getElementById('page-confirm');
  const confirmMovie = document.getElementById('confirmMovie');
  const confirmContinue = document.getElementById('confirmContinue');

  const pageRoulette = document.getElementById('page-roulette');
  const rouletteCaption = document.getElementById('rouletteCaption');
  const rouletteFrame = document.getElementById('rouletteFrame');
  const rouletteImgs = document.querySelectorAll('.roulette-img');
  const rouletteTitle = document.getElementById('rouletteTitle');
  const rouletteContinue = document.getElementById('rouletteContinue');

  nameLine.textContent = NAME;
  nameEcho.textContent = NAME;

  // ---- ambient gold dust background ----
  (function initDust(){
    const canvas = document.createElement('canvas');
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    document.getElementById('dustCanvas').appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const COUNT = 46;
    const particles = Array.from({length: COUNT}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: 0.6 + Math.random() * 1.6,
      speed: 0.08 + Math.random() * 0.22,
      drift: (Math.random() - 0.5) * 0.15,
      alpha: 0.15 + Math.random() * 0.35,
      twinkle: Math.random() * Math.PI * 2
    }));

    // occasional shooting star streak
    let shootingStar = null;
    function maybeSpawnStar(){
      if(!shootingStar && Math.random() < 0.006){
        shootingStar = {
          x: Math.random() * w * 0.6,
          y: Math.random() * h * 0.3,
          vx: 3.2 + Math.random() * 1.6,
          vy: 1.6 + Math.random() * 0.8,
          life: 0,
          maxLife: 40
        };
      }
    }

    function drawStar(){
      if(!shootingStar) return;
      const s = shootingStar;
      s.x += s.vx;
      s.y += s.vy;
      s.life++;
      const fade = 1 - s.life / s.maxLife;
      if(fade <= 0 || s.x > w + 40 || s.y > h + 40){
        shootingStar = null;
        return;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(fade, 0);
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 9, s.y - s.vy * 9);
      grad.addColorStop(0, 'rgba(255,245,220,0.9)');
      grad.addColorStop(1, 'rgba(255,245,220,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 9, s.y - s.vy * 9);
      ctx.stroke();
      ctx.restore();
    }

    function frame(){
      ctx.clearRect(0, 0, w, h);
      for(const p of particles){
        p.y -= p.speed;
        p.x += p.drift;
        p.twinkle += 0.02;
        if(p.y < -10){ p.y = h + 10; p.x = Math.random() * w; }
        if(p.x < -10) p.x = w + 10;
        if(p.x > w + 10) p.x = -10;
        const a = p.alpha * (0.6 + 0.4 * Math.sin(p.twinkle));
        ctx.beginPath();
        ctx.fillStyle = `rgba(243,205,107,${a})`;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      maybeSpawnStar();
      drawStar();
      requestAnimationFrame(frame);
    }
    frame();
  })();

  // ---- mouse-reactive parallax on the dust layer (desktop only) ----
  const dustEl = document.getElementById('dustCanvas');
  if(window.matchMedia('(pointer: fine)').matches){
    window.addEventListener('mousemove', (e) => {
      const nx = (e.clientX / window.innerWidth - 0.5);
      const ny = (e.clientY / window.innerHeight - 0.5);
      dustEl.style.transform = `translate(${nx * -14}px, ${ny * -14}px)`;
    });
  }

  // ---- typewriter helper ----
  function typewrite(el, text, speed = 32, onDone){
    el.textContent = '';
    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';
    cursor.textContent = '|';
    let idx = 0;
    function step(){
      el.textContent = text.slice(0, idx);
      el.appendChild(cursor);
      if(idx < text.length){
        idx++;
        setTimeout(step, speed);
      } else {
        setTimeout(() => cursor.remove(), 900);
        if(onDone) onDone();
      }
    }
    step();
  }

  // ---- 3D tilt on option cards (pointer-fine only) ----
  if(window.matchMedia('(pointer: fine)').matches){
    document.querySelectorAll('.option-thumb').forEach(thumb => {
      const card = thumb.closest('.option-card');
      card.addEventListener('mousemove', (e) => {
        const r = thumb.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - 0.5;
        const py = (e.clientY - r.top) / r.height - 0.5;
        thumb.style.transform = `rotateX(${py * -14}deg) rotateY(${px * 14}deg) translateY(-3px)`;
      });
      card.addEventListener('mouseleave', () => {
        thumb.style.transform = '';
      });
    });
  }

  // ---- wax seal intro ----
  function breakSeal(){
    if(sealWrap.classList.contains('crack')) return;
    sealWrap.classList.add('crack');
    sealWrap.classList.add('hide');
    setTimeout(() => { sealWrap.style.display = 'none'; }, 1100);
  }
  sealWrap.addEventListener('click', breakSeal);
  // auto-break after a short pause in case the user doesn't tap
  setTimeout(breakSeal, 2600);

  // ---- shared page transition (curtain drape) ----
  function transition(fromEl, toEl, onSettled){
    drape.classList.add('run');
    drape.querySelectorAll('.drape-panel').forEach(p => p.classList.add('run'));

    setTimeout(() => {
      fromEl.classList.remove('active');
      toEl.classList.add('active');
    }, 470);

    setTimeout(() => {
      drape.classList.remove('run');
      drape.querySelectorAll('.drape-panel').forEach(p => p.classList.remove('run'));
      if(onSettled) onSettled();
    }, 1100);
  }

  // ---- page 1: letter-by-letter "Hey" + "Heyyyy" + name slide-in ----
  (function animateHey(){
    const h1 = pageName.querySelector('h1');
    const letters = 'Hey'.split('');
    h1.innerHTML = '';
    letters.forEach((ch, idx) => {
      const span = document.createElement('span');
      span.className = 'hey-letter';
      span.textContent = ch;
      span.style.animationDelay = `${idx * 0.12}s`;
      h1.appendChild(span);
    });
    const ySpan = document.createElement('span');
    ySpan.id = 'extraYsRebuilt';
    h1.appendChild(ySpan);
  })();
  const extraYsTarget = document.getElementById('extraYsRebuilt');

  const EXTRA_YS = 4;
  let i = 0;
  function addY(){
    if(i >= EXTRA_YS){
      setTimeout(() => {
        nameLine.classList.add('show');
        setTimeout(() => nameLine.classList.add('shimmer'), 700);
      }, 200);
      return;
    }
    const span = document.createElement('span');
    span.className = 'extra-y';
    span.textContent = 'y';
    extraYsTarget.appendChild(span);
    requestAnimationFrame(() => span.classList.add('show'));
    i++;
    setTimeout(addY, 170);
  }
  setTimeout(addY, 3200);

  const NAME_ANIM_DONE = 1400;
  const HOLD_TIME = 3000;

  setTimeout(() => {
    transition(pageName, pageYes, () => {
      // hold on the "since you said yes" line, then move to the Q&A
      setTimeout(() => transition(pageYes, pageQa), 3000);
    });
  }, 3200 + NAME_ANIM_DONE + HOLD_TIME);

  // ---- Q&A page ----
  let selectedMovie = null;
  optionButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      optionButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedMovie = btn.getAttribute('data-choice');
      qaContinue.classList.add('show');
    });
  });

  husbandBtn.addEventListener('click', () => {
    transition(pageQa, pageRoulette, runRoulette);
  });

  function fireConfetti(){
    if(typeof confetti !== 'function') return;
    const colors = ['#d9a441', '#f3cd6b', '#8c2f45', '#f7ecd9'];
    confetti({
      particleCount: 120,
      spread: 75,
      startVelocity: 36,
      origin: { y: 0.55 },
      colors
    });
    setTimeout(() => confetti({
      particleCount: 70,
      spread: 110,
      startVelocity: 24,
      origin: { x: 0.25, y: 0.5 },
      colors
    }), 180);
    setTimeout(() => confetti({
      particleCount: 70,
      spread: 110,
      startVelocity: 24,
      origin: { x: 0.75, y: 0.5 },
      colors
    }), 260);
    setTimeout(() => confetti({
      particleCount: 40,
      spread: 130,
      startVelocity: 18,
      origin: { y: 0.45 },
      colors
    }), 550);
  }

  function runRoulette(){
    rouletteFrame.classList.remove('landed', 'holding', 'punch');
    rouletteFrame.classList.add('spinning');
    rouletteTitle.classList.remove('show');
    rouletteContinue.classList.remove('show');
    document.getElementById('rouletteRays').classList.remove('show');
    rouletteCaption.textContent = "let your husband decide...";

    rouletteImgs.forEach(img => img.classList.remove('active'));
    rouletteImgs[0].classList.add('active');

    // spin through the three regular posters, slowing down each step
    const spinOrder = [1, 2, 0, 1, 2, 0, 1, 2];
    const delays =    [90, 100, 120, 150, 190, 250, 330, 430];

    let step = 0;
    function spin(){
      if(step < spinOrder.length){
        rouletteImgs.forEach(img => img.classList.remove('active'));
        rouletteImgs[spinOrder[step]].classList.add('active');
        step++;
        setTimeout(spin, delays[Math.min(step - 1, delays.length - 1)]);
      } else {
        // hold your breath moment before the reveal
        rouletteFrame.classList.remove('spinning');
        rouletteFrame.classList.add('holding');
        rouletteCaption.textContent = 'drumroll please...';
        setTimeout(() => {
          rouletteFrame.classList.remove('holding');
          rouletteImgs.forEach(img => img.classList.remove('active'));
          document.getElementById('rouletteWinnerImg').classList.add('active');
          rouletteFrame.classList.add('landed', 'punch');
          document.getElementById('rouletteRays').classList.add('show');
          rouletteCaption.textContent = "surprise, you're watching...";
          rouletteTitle.textContent = 'THE IDEA OF YOU';
          rouletteTitle.classList.add('show');
          rouletteContinue.classList.add('show');
          reportChoice('The Idea of You', 'husband decided');
          fireConfetti();
          const flash = document.getElementById('screenFlash');
          flash.classList.remove('fire');
          void flash.offsetWidth;
          flash.classList.add('fire');
          pageRoulette.classList.remove('shake');
          void pageRoulette.offsetWidth;
          pageRoulette.classList.add('shake');
          setTimeout(() => rouletteFrame.classList.remove('punch'), 500);
        }, 950);
      }
    }
    spin();
  }

  rouletteContinue.addEventListener('click', () => {
    transition(pageRoulette, pageThanks);
  });

  const confirmTail = document.getElementById('confirmTail');

  function buildConfirmMovie(text){
    confirmMovie.innerHTML = '';
    text.split('').forEach((ch, idx) => {
      const span = document.createElement('span');
      span.className = 'letter';
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.animationDelay = `${idx * 0.045}s`;
      confirmMovie.appendChild(span);
    });
    return text.length * 45 + 400;
  }

  qaContinue.addEventListener('click', () => {
    const movie = selectedMovie || 'this';
    reportChoice(movie, 'picked');
    confirmContinue.classList.remove('show');
    confirmTail.style.animation = 'none';
    confirmTail.style.opacity = '0';
    document.getElementById('confirmRays').classList.remove('show');
    transition(pageQa, pageConfirm, () => {
      const letterTime = buildConfirmMovie(movie);
      setTimeout(() => {
        document.getElementById('confirmRays').classList.add('show');
        confirmTail.style.animation = 'fadeIn 0.5s ease forwards';
      }, letterTime);
      setTimeout(() => confirmContinue.classList.add('show'), letterTime + 500);
    });
  });

  confirmContinue.addEventListener('click', () => {
    transition(pageConfirm, pageThanks);
  });
</script>

</body>
</html>
