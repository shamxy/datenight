<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>date</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Sora:wght@400;600&display=swap');

  :root{
    --plum: #3a1f2b;
    --blush: #f4d8d8;
    --rose: #c9536b;
    --gold: #d9a441;
    --cream: #fbf3ec;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background: var(--plum);
    font-family:'Sora', sans-serif;
    overflow:hidden;
  }

  .stage{
    position:relative;
    height:100vh;
    width:100vw;
  }

  .page{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.15s ease;
  }

  .page.active{
    opacity:1;
    pointer-events:auto;
  }

  #page-name h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(2.2rem, 7vw, 3.6rem);
    color:var(--cream);
    margin:0;
    white-space:nowrap;
  }

  #page-name .extra-y{
    display:inline-block;
    opacity:0;
    transform: translateY(6px);
  }

  #page-name .extra-y.show{
    animation: popIn 0.25s ease forwards;
  }

  @keyframes popIn{
    to{ opacity:1; transform:translateY(0); }
  }

  #page-name .name-line{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(1.4rem, 4.5vw, 2rem);
    color:var(--gold);
    margin-top:22px;
    opacity:0;
    transform: translateY(-140px);
  }

  #page-name .name-line.show{
    animation: slideIn 0.6s ease-out forwards;
  }

  @keyframes slideIn{
    0%   { opacity:0; transform: translateY(-140px); }
    100% { opacity:1; transform: translateY(0); }
  }

  /* transition sweep */
  .sweep{
    position:absolute;
    inset:0;
    background: var(--rose);
    transform: scaleX(0);
    transform-origin:left;
    z-index:5;
    pointer-events:none;
  }

  .sweep.run{
    animation: sweepAcross 1.1s cubic-bezier(.77,0,.18,1) forwards;
  }

  @keyframes sweepAcross{
    0%   { transform: scaleX(0); transform-origin:left; }
    35%  { transform: scaleX(1); transform-origin:left; }
    65%  { transform: scaleX(1); transform-origin:right; }
    100% { transform: scaleX(0); transform-origin:right; }
  }

  #page-yes p{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(1.6rem, 5vw, 2.6rem);
    color:var(--blush);
    line-height:1.3;
    max-width:600px;
  }

  #page-yes .name-fill{
    color:var(--gold);
    font-style:normal;
    font-weight:600;
  }

  #page-yes .sub{
    margin-top:18px;
    font-family:'Sora', sans-serif;
    font-style:normal;
    font-size:1rem;
    color: rgba(244,216,216,0.7);
  }

  /* Q&A page */
  #page-qa{
    gap:0;
  }

  .qa-question{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(1.6rem, 5vw, 2.4rem);
    color:var(--cream);
    margin-bottom:34px;
    max-width:520px;
  }

  .qa-options{
    display:flex;
    flex-direction:row;
    flex-wrap:wrap;
    justify-content:center;
    gap:18px;
    width:100%;
    max-width:560px;
  }

  .option-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    width:150px;
    cursor:pointer;
  }

  .option-thumb{
    position:relative;
    width:100%;
    height:104px;
    border:2px dashed rgba(251,243,236,0.35);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.75rem;
    color: rgba(251,243,236,0.45);
    background: rgba(255,255,255,0.02);
    overflow:hidden;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }

  .option-thumb img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }

  .option-badge{
    width:26px;
    height:26px;
    border-radius:50%;
    background: var(--gold);
    color: var(--plum);
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:0.9rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .option-label{
    width:100%;
    border:2px solid rgba(217,164,65,0.5);
    border-radius:8px;
    padding:6px 8px;
    font-family:'Sora', sans-serif;
    font-size:0.8rem;
    color: var(--cream);
    text-align:center;
    line-height:1.25;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .option-card:hover .option-thumb{
    border-color: var(--gold);
    transform: translateY(-2px);
  }

  .option-card.selected .option-thumb{
    border-color: var(--gold);
    background: rgba(217,164,65,0.14);
  }

  .option-card.selected .option-label{
    border-color: var(--gold);
    background: rgba(217,164,65,0.1);
  }

  .reveal-thumb{
    position:relative;
    width:150px;
    height:104px;
    margin-top:14px;
    border:2px dashed rgba(217,164,65,0.6);
    border-radius:10px;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:0.75rem;
    color: rgba(217,164,65,0.7);
    text-align:center;
    padding:6px;
    overflow:hidden;
  }

  .reveal-thumb.show{
    display:flex;
  }

  .reveal-label{
    width:150px;
    margin-top:10px;
    display:none;
  }

  .reveal-label.show{
    display:block;
  }

  .reveal-thumb img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }
  .husband-btn{
    margin-top:30px;
    background:transparent;
    border:2px dashed rgba(217,164,65,0.55);
    color: var(--gold);
    font-family:'Sora', sans-serif;
    font-size:0.9rem;
    padding:11px 26px;
    border-radius:999px;
    cursor:pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }

  .husband-btn:hover{
    border-color: var(--gold);
    background: rgba(217,164,65,0.08);
    transform: translateY(-1px);
  }

  .roulette-display{
    min-height:64px;
    margin-top:18px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.15rem;
    color: var(--gold);
    max-width:420px;
    line-height:1.4;
  }

  .continue-btn{
    margin-top:30px;
    background:var(--rose);
    color:var(--cream);
    border:none;
    padding:12px 34px;
    border-radius:999px;
    font-family:'Sora', sans-serif;
    font-size:1rem;
    cursor:pointer;
    opacity:0;
    transform: translateY(8px);
    pointer-events:none;
    transition: opacity 0.4s ease, transform 0.4s ease, background 0.2s ease;
  }

  .continue-btn.show{
    opacity:1;
    transform: translateY(0);
    pointer-events:auto;
  }

  .continue-btn:hover{
    background:#b8455c;
  }

  .roulette-caption{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:clamp(1.3rem, 4vw, 1.8rem);
    color: var(--gold);
    margin-bottom:26px;
    min-height:2.4em;
  }

  .roulette-frame{
    position:relative;
    width:220px;
    height:300px;
    border:2px solid rgba(217,164,65,0.5);
    border-radius:14px;
    overflow:hidden;
    background: rgba(255,255,255,0.02);
  }

  .roulette-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
  }

  .roulette-img.active{
    opacity:1;
  }

  .roulette-frame.landed{
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(217,164,65,0.15);
  }

  .roulette-title{
    margin-top:20px;
    font-family:'Sora', sans-serif;
    font-size:0.85rem;
    color: var(--cream);
    opacity:0;
    transition: opacity 0.4s ease;
  }

  .roulette-title.show{
    opacity:1;
  }

  /* Thank-you page */
  #page-thanks p{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(1.8rem, 5.5vw, 2.8rem);
    color:var(--blush);
    line-height:1.4;
  }
</style>
</head>
<body>

<div class="stage">

  <div class="page active" id="page-name">
    <h1>Hey<span id="extraYs"></span></h1>
    <div class="name-line" id="nameLine">Abena</div>
  </div>

  <div class="page" id="page-yes">
    <p>since you said yes to my date, <span class="name-fill" id="nameEcho">Abena</span>...</p>
    <div class="sub" id="tapHint">let's figure out the rest</div>
  </div>

  <div class="page" id="page-qa">
    <div class="qa-question">what movie do you wanna watch?</div>
    <div class="qa-options" id="qaOptions">
      <div class="option-card" data-choice="Spiderman: Brand New Day">
        <span class="option-badge">A</span>
        <!-- PUT SPIDERMAN POSTER HERE: replace src="" below with your image path -->
        <div class="option-thumb">
          <span class="thumb-placeholder">drop image here</span>
          <img src="spiderman.png" alt="Spiderman: Brand New Day poster" onload="this.style.display='block'; this.previousElementSibling.style.display='none';">
        </div>
        <div class="option-label">Spiderman: Brand New Day</div>
      </div>
      <div class="option-card" data-choice="The Michael Jackson Movie">
        <span class="option-badge">B</span>
        <!-- PUT MICHAEL JACKSON MOVIE POSTER HERE: replace src="" below -->
        <div class="option-thumb">
          <span class="thumb-placeholder">drop image here</span>
          <img src="mj-movie.png" alt="Michael Jackson movie poster" onload="this.style.display='block'; this.previousElementSibling.style.display='none';">
        </div>
        <div class="option-label">The Michael Jackson Movie</div>
      </div>
      <div class="option-card" data-choice="Love + wine">
        <span class="option-badge">C</span>
        <!-- PUT LOVE + WINE PICTURE HERE: replace src="" below -->
        <div class="option-thumb">
          <span class="thumb-placeholder">drop image here</span>
          <img src="love+wine.png" alt="Love and wine" onload="this.style.display='block'; this.previousElementSibling.style.display='none';">
        </div>
        <div class="option-label">Love + wine</div>
      </div>
    </div>
    <button class="continue-btn" id="qaContinue">Continue</button>
    <button class="husband-btn" id="husbandBtn">let your husband decide</button>
  </div>

  <div class="page" id="page-roulette">
    <div class="roulette-caption" id="rouletteCaption">let's see...</div>
    <div class="roulette-frame" id="rouletteFrame">
      <!-- PUT SPIDERMAN POSTER HERE -->
      <img class="roulette-img active" src="spiderman.png" alt="Spiderman: Brand New Day poster">
      <!-- PUT MICHAEL JACKSON MOVIE POSTER HERE -->
      <img class="roulette-img" src="mj-movie.png" alt="Michael Jackson movie poster">
      <!-- PUT LOVE + WINE PICTURE HERE -->
      <img class="roulette-img" src="love+wine.png" alt="Love and wine">
      <!-- PUT "THE IDEA OF YOU" POSTER HERE — this is the one left alone at the end -->
      <img class="roulette-img" id="rouletteWinnerImg" src="theideaofyou.png" alt="The Idea of You poster">
    </div>
    <div class="roulette-title" id="rouletteTitle"></div>
    <button class="continue-btn" id="rouletteContinue">Continue</button>
  </div>

  <div class="page" id="page-thanks">
    <p>Thank you for your time,<br>xoxo</p>
  </div>

  <div class="sweep" id="sweep"></div>

</div>

<script>
  // change this to whatever her name is — it drives both pages
  const NAME = "Abena";

  const pageName = document.getElementById('page-name');
  const pageYes = document.getElementById('page-yes');
  const pageQa = document.getElementById('page-qa');
  const pageThanks = document.getElementById('page-thanks');
  const extraYs = document.getElementById('extraYs');
  const nameLine = document.getElementById('nameLine');
  const nameEcho = document.getElementById('nameEcho');
  const sweep = document.getElementById('sweep');

  const optionButtons = document.querySelectorAll('.option-card');
  const husbandBtn = document.getElementById('husbandBtn');
  const qaContinue = document.getElementById('qaContinue');

  const pageRoulette = document.getElementById('page-roulette');
  const rouletteCaption = document.getElementById('rouletteCaption');
  const rouletteFrame = document.getElementById('rouletteFrame');
  const rouletteImgs = document.querySelectorAll('.roulette-img');
  const rouletteTitle = document.getElementById('rouletteTitle');
  const rouletteContinue = document.getElementById('rouletteContinue');

  nameLine.textContent = NAME;
  nameEcho.textContent = NAME;

  // ---- shared page transition ----
  function transition(fromEl, toEl, onSettled){
    sweep.classList.add('run');

    setTimeout(() => {
      fromEl.classList.remove('active');
      toEl.classList.add('active');
    }, 450);

    setTimeout(() => {
      sweep.classList.remove('run');
      if(onSettled) onSettled();
    }, 1100);
  }

  // ---- page 1: "Heyyyy" + name slide-in ----
  const EXTRA_YS = 4;
  let i = 0;
  function addY(){
    if(i >= EXTRA_YS){
      setTimeout(() => nameLine.classList.add('show'), 200);
      return;
    }
    const span = document.createElement('span');
    span.className = 'extra-y';
    span.textContent = 'y';
    extraYs.appendChild(span);
    requestAnimationFrame(() => span.classList.add('show'));
    i++;
    setTimeout(addY, 160);
  }
  setTimeout(addY, 400);

  const NAME_ANIM_DONE = 1400;
  const HOLD_TIME = 3000;

  setTimeout(() => {
    transition(pageName, pageYes, () => {
      // hold on the "since you said yes" line, then move to the Q&A
      setTimeout(() => transition(pageYes, pageQa), 3000);
    });
  }, NAME_ANIM_DONE + HOLD_TIME);

  // ---- Q&A page ----
  optionButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      optionButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      qaContinue.classList.add('show');
    });
  });

  husbandBtn.addEventListener('click', () => {
    transition(pageQa, pageRoulette, runRoulette);
  });

  function runRoulette(){
    rouletteFrame.classList.remove('landed');
    rouletteTitle.classList.remove('show');
    rouletteContinue.classList.remove('show');
    rouletteCaption.textContent = "let your husband decide...";

    rouletteImgs.forEach(img => img.classList.remove('active'));
    rouletteImgs[0].classList.add('active');

    // spin through the three regular posters, slowing down each step
    const spinOrder = [1, 2, 0, 1, 2, 0, 1, 2];
    const delays =    [90, 100, 120, 150, 190, 250, 330, 430];

    let step = 0;
    function spin(){
      if(step < spinOrder.length){
        rouletteImgs.forEach(img => img.classList.remove('active'));
        rouletteImgs[spinOrder[step]].classList.add('active');
        step++;
        setTimeout(spin, delays[Math.min(step - 1, delays.length - 1)]);
      } else {
        rouletteCaption.textContent = 'drumroll please...';
        setTimeout(() => {
          rouletteImgs.forEach(img => img.classList.remove('active'));
          document.getElementById('rouletteWinnerImg').classList.add('active');
          rouletteFrame.classList.add('landed');
          rouletteCaption.textContent = "surprise, you're watching...";
          rouletteTitle.textContent = 'THE IDEA OF YOU';
          rouletteTitle.classList.add('show');
          rouletteContinue.classList.add('show');
        }, 700);
      }
    }
    spin();
  }

  rouletteContinue.addEventListener('click', () => {
    transition(pageRoulette, pageThanks);
  });

  qaContinue.addEventListener('click', () => {
    transition(pageQa, pageThanks);
  });
</script>

</body>
</html>
